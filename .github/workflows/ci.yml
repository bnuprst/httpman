name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sandbox bundle is up to date
        working-directory: sandbox
        run: |
          npm ci
          npm run build
          git diff --exit-code -- ../internal/script/sandbox.bundle.js
      - name: Go vet & test
        run: |
          go vet -tags nogui ./...
          go test -tags nogui ./...
      - name: Frontend typecheck & build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Cross-compile Windows desktop app
        run: node scripts/build.mjs --target windows/amd64 --skip-frontend

  build-linux-gui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: node scripts/build.mjs

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags nogui ./...
