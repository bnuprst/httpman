name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0)'
        required: true
      publish:
        description: 'Publish to npm and create a GitHub release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: windows/amd64 }
          - { runner: windows-latest, target: windows/arm64 }
          - { runner: macos-14, target: darwin/arm64 }
          - { runner: macos-14, target: darwin/amd64 }
          - { runner: ubuntu-22.04, target: linux/amd64 }
          - { runner: ubuntu-22.04-arm, target: linux/arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build
        shell: bash
        run: node scripts/build.mjs --target ${{ matrix.target }} --version "${VERSION#v}"
      - name: Artifact name
        id: name
        shell: bash
        run: echo "name=bin-$(echo '${{ matrix.target }}' | tr / -)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: dist/bin
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event.inputs.publish == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: dist/bin
          pattern: bin-*
          merge-multiple: true
      - name: Archives
        run: |
          V="${VERSION#v}"
          mkdir -p dist/release
          chmod +x dist/bin/*/httpman 2>/dev/null || true
          for d in dist/bin/*/; do
            t=$(basename "$d")
            if [ -f "$d/httpman.exe" ]; then
              (cd "$d" && zip -q "../../release/httpman-$V-$t.zip" httpman.exe)
            else
              tar -czf "dist/release/httpman-$V-$t.tar.gz" -C "$d" httpman
            fi
          done
          (cd dist/release && sha256sum * > SHA256SUMS)
          ls -la dist/release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(env.VERSION, 'v') && env.VERSION || format('v{0}', env.VERSION) }}
          files: dist/release/*
          generate_release_notes: true
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/npm-package.mjs "${VERSION#v}"
          for d in dist/npm/httpman-app-*/; do npm publish --access public "$d"; done
          npm publish --access public dist/npm/httpman-app
