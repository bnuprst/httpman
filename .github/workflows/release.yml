# CI and releases in one workflow, so every platform build runs on each push
# and PR instead of only when a tag is pushed. The file keeps the name
# release.yml because each npm package's trusted publisher is bound to it.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0)'
        required: true
      publish:
        description: 'Publish to npm and create a GitHub release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede branch and PR runs, never a release.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

env:
  VERSION: ${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'dev' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sandbox bundle is up to date
        working-directory: sandbox
        run: |
          npm ci
          npm run build
          git diff --exit-code -- ../internal/script/sandbox.bundle.js
      - name: Go vet & test
        run: |
          go vet -tags nogui ./...
          go test -tags nogui ./...
      - name: Frontend typecheck & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags nogui ./...

  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS runners can queue for a long time, so plain branch pushes skip
        # them; PRs, main, tags and manual runs build macOS too. Every target
        # here must match npm/httpman-app/package.json optionalDependencies.
        os: ${{ fromJSON((github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && '["windows","darwin","linux"]' || '["windows","linux"]') }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.os == 'windows' && 'windows-latest' || matrix.os == 'darwin' && 'macos-15' || matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build
        shell: bash
        run: node scripts/build.mjs --target ${{ matrix.os }}/${{ matrix.arch }} --version "${VERSION#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/bin
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [test, test-windows, build]
    # !cancelled() lets a release go ahead when a build fails (npm-package.mjs
    # --require-all still refuses to stage without every binary), but the tests must pass.
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.test-windows.result == 'success' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event.inputs.publish == 'true') }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # GitHub release
      id-token: write # npm trusted publishing (OIDC), no npm token needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install npm with staged publishing
        run: npm install -g npm@12
      - uses: actions/download-artifact@v4
        with:
          path: dist/bin
          pattern: bin-*
          merge-multiple: true
      - name: Archives
        run: |
          V="${VERSION#v}"
          mkdir -p dist/release
          chmod +x dist/bin/*/httpman 2>/dev/null || true
          for d in dist/bin/*/; do
            t=$(basename "$d")
            if [ -f "$d/httpman.exe" ]; then
              (cd "$d" && zip -q "../../release/httpman-$V-$t.zip" httpman.exe)
            else
              tar -czf "dist/release/httpman-$V-$t.tar.gz" -C "$d" httpman
            fi
          done
          (cd dist/release && sha256sum * > SHA256SUMS)
          ls -la dist/release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(env.VERSION, 'v') && env.VERSION || format('v{0}', env.VERSION) }}
          files: dist/release/*
          generate_release_notes: true
      - name: Stage npm packages
        run: |
          node scripts/npm-package.mjs "${VERSION#v}" --require-all
          # Authenticates through npm trusted publishing (each package trusts this
          # workflow). Versions land in the staged queue and a maintainer approves
          # them with 2FA (npm stage list / npm stage approve).
          # Skip versions already published or staged so a re-run can finish a partial run.
          failed=()
          for d in dist/npm/httpman-app-*/ dist/npm/httpman-app/; do
            name="$(node -p "require('./$d/package.json').name")"
            version="$(node -p "require('./$d/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then echo "skip $name@$version (already published)"; continue; fi
            if npm stage list "$name" --json 2>/dev/null | V="$version" node -e "
              const items = JSON.parse(require('fs').readFileSync(0, 'utf8') || '[]');
              process.exit(items.some((i) => i.version === process.env.V && i.status !== 'rejected') ? 0 : 1)"; then
              echo "skip $name@$version (already staged)"; continue
            fi
            # Keep going on failure so one rejected package doesn't hide the state of the rest.
            npm stage publish --access public "$d" || failed+=("$name@$version")
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Failed to stage: ${failed[*]}"
            exit 1
          fi
          echo "::notice::Staged ${VERSION#v}. Approve each package with 2FA: npm stage list, then npm stage approve <id> (platform packages before httpman-app)."
