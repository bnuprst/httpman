name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0)'
        required: true
      publish:
        description: 'Publish to npm and create a GitHub release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: windows/amd64 }
          - { runner: windows-latest, target: windows/arm64 }
          - { runner: macos-14, target: darwin/arm64 }
          - { runner: macos-14, target: darwin/amd64 }
          - { runner: ubuntu-22.04, target: linux/amd64 }
          - { runner: ubuntu-22.04-arm, target: linux/arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build
        shell: bash
        run: node scripts/build.mjs --target ${{ matrix.target }} --version "${VERSION#v}"
      - name: Artifact name
        id: name
        shell: bash
        run: echo "name=bin-$(echo '${{ matrix.target }}' | tr / -)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: dist/bin
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event.inputs.publish == 'true') }}
    runs-on: ubuntu-latest
    environment: npm # NPM_TOKEN is an environment secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install npm with staged publishing
        run: npm install -g npm@12
      - name: Check npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set. Add a granular \"Read and write (stage only)\" npm token as a secret of the npm environment."
            exit 1
          fi
          npm whoami
      - uses: actions/download-artifact@v4
        with:
          path: dist/bin
          pattern: bin-*
          merge-multiple: true
      - name: Archives
        run: |
          V="${VERSION#v}"
          mkdir -p dist/release
          chmod +x dist/bin/*/httpman 2>/dev/null || true
          for d in dist/bin/*/; do
            t=$(basename "$d")
            if [ -f "$d/httpman.exe" ]; then
              (cd "$d" && zip -q "../../release/httpman-$V-$t.zip" httpman.exe)
            else
              tar -czf "dist/release/httpman-$V-$t.tar.gz" -C "$d" httpman
            fi
          done
          (cd dist/release && sha256sum * > SHA256SUMS)
          ls -la dist/release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(env.VERSION, 'v') && env.VERSION || format('v{0}', env.VERSION) }}
          files: dist/release/*
          generate_release_notes: true
      - name: Stage npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/npm-package.mjs "${VERSION#v}" --require-all
          # NPM_TOKEN is stage-only: versions land in the staged queue and a
          # maintainer approves them with 2FA (npm stage list / npm stage approve).
          # Skip versions already published or staged so a re-run can finish a partial run.
          failed=()
          for d in dist/npm/httpman-app-*/ dist/npm/httpman-app/; do
            name="$(node -p "require('./$d/package.json').name")"
            version="$(node -p "require('./$d/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then echo "skip $name@$version (already published)"; continue; fi
            if npm stage list "$name" --json 2>/dev/null | V="$version" node -e "
              const items = JSON.parse(require('fs').readFileSync(0, 'utf8') || '[]');
              process.exit(items.some((i) => i.version === process.env.V && i.status !== 'rejected') ? 0 : 1)"; then
              echo "skip $name@$version (already staged)"; continue
            fi
            # Keep going on failure so one rejected package doesn't hide the state of the rest.
            npm stage publish --access public "$d" || failed+=("$name@$version")
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Failed to stage: ${failed[*]}"
            exit 1
          fi
          echo "::notice::Staged ${VERSION#v}. Approve each package with 2FA: npm stage list, then npm stage approve <id> (platform packages before httpman-app)."
